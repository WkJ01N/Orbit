name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: python3 tool/test_generate_update_manifest.py
      - run: node --test cloudbase/functions/orbit-api/scope-updates.test.js
      - run: flutter build apk --debug
      # Flutter creates the ignored Gradle wrapper during the first Android build.
      - run: cd android && ./gradlew :app:testDebugUnitTest

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true
      - run: flutter pub get
      # Golden baselines are generated on Windows to keep font rendering stable.
      - run: flutter test test/schedule_responsive_golden_test.dart test/foreground_resume_test.dart test/grid_delete_flow_test.dart test/grid_delete_targets_test.dart test/strong_grid_decoration_test.dart
      - run: flutter build windows --release

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
            > android/key.properties
      - run: flutter build apk --release --dart-define=ORBIT_CLOUDBASE_ENV=orbit-sync-beta-d6fjsl9220203313 --dart-define=ORBIT_CLOUDBASE_REGION=ap-shanghai --dart-define=ORBIT_API_BASE_URL=https://orbit-sync-beta-d6fjsl9220203313-1302156756.ap-shanghai.app.tcloudbase.com/orbit
      - run: cp build/app/outputs/flutter-apk/app-release.apk orbit-${{ github.ref_name }}-android.apk
      # Build each target independently: --split-per-abi adds versionCode offsets
      # intended for Play multi-APK tracks and prevents fallback to universal APKs.
      - name: Build architecture APKs with the same version code
        run: |
          for entry in arm64-v8a:android-arm64 armeabi-v7a:android-arm x86_64:android-x64; do
            abi="${entry%%:*}"
            target="${entry#*:}"
            flutter build apk --release --target-platform "$target" --dart-define=ORBIT_CLOUDBASE_ENV=orbit-sync-beta-d6fjsl9220203313 --dart-define=ORBIT_CLOUDBASE_REGION=ap-shanghai --dart-define=ORBIT_API_BASE_URL=https://orbit-sync-beta-d6fjsl9220203313-1302156756.ap-shanghai.app.tcloudbase.com/orbit
            cp build/app/outputs/flutter-apk/app-release.apk "orbit-${{ github.ref_name }}-$abi.apk"
          done
      - name: Verify Android version codes
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          aapt=$(find "$sdk/build-tools" -name aapt | sort -V | tail -n 1)
          expected=$(sed -n 's/^version:.*+//p' pubspec.yaml | tr -d '\r')
          for apk in orbit-${{ github.ref_name }}-*.apk; do
            badging=$("$aapt" dump badging "$apk")
            [[ "$badging" == *"versionCode='$expected'"* ]] || { echo "Wrong version code in $apk"; exit 1; }
            if [[ "$apk" != *-android.apk ]]; then
              expected_abi="${apk#orbit-${{ github.ref_name }}-}"
              expected_abi="${expected_abi%.apk}"
              native=$(printf '%s\n' "$badging" | sed -n 's/^native-code: //p' | tr -d "'")
              [ "$native" = "$expected_abi" ] || { echo "Unexpected native libraries in $apk: $native"; exit 1; }
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: orbit-${{ github.ref_name }}-*.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=ORBIT_CLOUDBASE_ENV=orbit-sync-beta-d6fjsl9220203313 --dart-define=ORBIT_CLOUDBASE_REGION=ap-shanghai --dart-define=ORBIT_API_BASE_URL=https://orbit-sync-beta-d6fjsl9220203313-1302156756.ap-shanghai.app.tcloudbase.com/orbit
      - name: Package Windows build
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath orbit-${{ github.ref_name }}-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: orbit-${{ github.ref_name }}-windows-x64.zip
          if-no-files-found: error

  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          path: dist
          merge-multiple: true
      - name: Generate official package checksums and update manifest
        run: python3 tool/generate_update_manifest.py dist
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          existing=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          if [ "$existing" = "false" ]; then
            echo "Release $TAG is already published; preserving its verified assets."
            exit 0
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "$TAG" --notes-file "release/$TAG/RELEASE_NOTES.md"
          gh release edit "$TAG" --title "$TAG" --notes-file "release/$TAG/RELEASE_NOTES.md"
          # Legacy apps choose the first APK in GitHub name order; architecture
          # packages omit "android-" so the unchanged universal name sorts first.
          gh release upload "$TAG" "dist/orbit-$TAG-android.apk" --clobber
          for file in dist/*; do
            [ "$file" = "dist/orbit-$TAG-android.apk" ] || gh release upload "$TAG" "$file" --clobber
          done
          first_apk=$(gh release view "$TAG" --json assets --jq '[.assets[] | select(.name | endswith(".apk"))][0].name')
          [ "$first_apk" = "orbit-$TAG-android.apk" ] || { echo "Universal APK must be first for legacy clients"; exit 1; }
          gh release edit "$TAG" --draft=false
